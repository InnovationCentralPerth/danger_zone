<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>danger_zone — AI Security Demonstrator</title>
  <script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/main.css"/>
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-black border-bottom border-danger">
  <div class="container-fluid">
    <span class="navbar-brand fw-bold text-danger fs-4">⚡ danger_zone</span>
    <span class="text-muted small">Agentic AI Security Demonstrator</span>
    <a href="/docs" class="btn btn-outline-secondary btn-sm" target="_blank">API Docs</a>
  </div>
</nav>

<div class="container-fluid py-3">
  <div class="row g-3">

    <!-- Heartbeat / status banner -->
    <div class="col-12">
      <div id="heartbeat-banner" class="alert alert-secondary mb-0 py-2">
        <span class="text-muted">Connecting to agent stream…</span>
      </div>
    </div>

    <!-- Incident feed -->
    <div class="col-lg-8">
      <div class="card bg-black border-secondary">
        <div class="card-header d-flex justify-content-between align-items-center border-secondary">
          <span class="fw-bold">Live Incidents</span>
          <span id="incident-count" class="badge bg-danger">0</span>
        </div>
        <div class="card-body p-0" style="max-height: 70vh; overflow-y: auto;">
          <div id="incident-list">
            <p class="text-muted text-center p-4">No incidents yet — watching…</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Agent trace feed -->
    <div class="col-lg-4">
      <div class="card bg-black border-secondary">
        <div class="card-header border-secondary fw-bold">Agent Reasoning</div>
        <div class="card-body p-0" style="max-height: 70vh; overflow-y: auto;">
          <div id="trace-list" class="p-2">
            <p class="text-muted text-center p-3 small">Waiting for agent activity…</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="/static/js/main.js"></script>
</body>
</html>
